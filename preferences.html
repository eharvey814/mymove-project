<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tell Us About You | MYMOVE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="preferences">

    <header class="site-header">
        <a href="index.html" class="logo">MYMOVE</a>
        <nav>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
            <a href="preferences.html" class="nav-button">Find My Move</a>
        </nav>
    </header>

    <main class="container">

        <h1>Tell us about YOU.</h1>
        <p>Answer three quick questions and we'll suggest a move.</p>

        <div class="question-grid">

            <section class="question">
                <h2>1. How much time do you have?</h2>
                <div class="options" data-group="time">
                    <button type="button" class="option" data-value="5" aria-pressed="false">5 minutes</button>
                    <button type="button" class="option" data-value="10" aria-pressed="false">10 minutes</button>
                    <button type="button" class="option" data-value="15" aria-pressed="false">15 minutes</button>
                    <button type="button" class="option" data-value="30" aria-pressed="false">30 minutes</button>
                </div>
            </section>

            <section class="question">
                <h2>2. How are you feeling?</h2>
                <div class="options" data-group="mood">
                    <button type="button" class="option" data-value="low-energy" aria-pressed="false">Low energy</button>
                    <button type="button" class="option" data-value="stressed" aria-pressed="false">Stressed</button>
                    <button type="button" class="option" data-value="energized" aria-pressed="false">Energized</button>
                    <button type="button" class="option" data-value="motivated" aria-pressed="false">Motivated</button>
                </div>
            </section>

            <section class="question">
                <h2>3. Where are you?</h2>
                <div class="options" data-group="place">
                    <button type="button" class="option" data-value="home" aria-pressed="false">Home</button>
                    <button type="button" class="option" data-value="outside" aria-pressed="false">Outside</button>
                    <button type="button" class="option" data-value="work" aria-pressed="false">Work/School</button>
                    <button type="button" class="option" data-value="gym" aria-pressed="false">Gym</button>
                </div>
            </section>

        </div>

        <p id="formError" class="error" role="alert"></p>

        <button type="button" id="findMove" class="button">Find My Move</button>

    </main>

    <script src="script.js"></script>
</body>

</html>
