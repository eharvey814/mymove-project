<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement | MYMOVE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="movement">

    <header class="site-header">
        <a href="index.html" class="logo">MYMOVE</a>
        <nav>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
            <a href="preferences.html" class="nav-button">Find My Move</a>
        </nav>
    </header>

    <main class="container">

        <p id="missingData" class="hidden">
            No move selected yet. <a href="preferences.html">Answer the three questions</a> to get one.
        </p>

        <section id="activity" class="two-column hidden">

            <div>
                <h1 id="activityTitle">Movement</h1>
                <div class="media-placeholder">Video</div>
                <h2>Steps</h2>
                <ol id="stepList" class="step-list"></ol>
            </div>

            <div class="timer-panel">
                <h2>Time</h2>
                <p id="timerDisplay" class="timer" aria-live="polite">00:00</p>
                <p id="timerMessage" role="status"></p>

                <div class="button-row">
                    <button type="button" id="startTimer" class="button secondary">Start</button>
                    <button type="button" id="pauseTimer" class="button secondary">Pause</button>
                    <button type="button" id="resetTimer" class="button secondary">Reset</button>
                </div>

                <button type="button" id="endMove" class="button">End Move</button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
